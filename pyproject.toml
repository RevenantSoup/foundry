[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-dataset-cli"
version = "0.1.0"
description = "Offline-first licensed image dataset CLI"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31", "Pillow>=10", "imagehash>=4.3", "numpy>=1.24",
  "sentence-transformers>=2.7", "ffmpeg-python>=0.2", "click>=8.1", "stripe>=17,<18"
]

[project.optional-dependencies]
test = ["pytest>=8"]
monitor = ["sentry-sdk>=2"]

[project.scripts]
foundry = "foundry.cli:cli"

[tool.setuptools.packages.find]
include = ["foundry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
